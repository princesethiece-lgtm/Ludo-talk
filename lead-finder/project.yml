name: LeadFinder
options:
  bundleIdPrefix: com.audionation
  deploymentTarget:
    iOS: "15.0"
targets:
  LeadFinder:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AN Lead Finder
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBG
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.audionation.leadfinder.refresh]
        NSLocalNetworkUsageDescription: "Lead Finder connects to your Synology NAS scanner on the office Wi-Fi."
        LSApplicationQueriesSchemes: [tel, whatsapp, comgooglemaps, instagram]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audionation.leadfinder
        PRODUCT_NAME: LeadFinder
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme: {}
