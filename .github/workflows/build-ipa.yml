name: Build iPhone app (.ipa)

on:
  push:
    branches: [main]
    paths-ignore:
      - "architect-finder/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned; Sideloadly signs it on your PC)
        run: |
          xcodebuild -project Ludo.xcodeproj -scheme Ludo -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/Ludo.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry AN-Ludo.ipa Payload
          ls -lh AN-Ludo.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AN-Ludo-ipa
          path: AN-Ludo.ipa

      - name: Publish as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AN Ludo build ${{ github.run_number }}
          files: AN-Ludo.ipa
          make_latest: true
