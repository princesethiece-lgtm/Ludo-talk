name: Build AN Quotation (.ipa)

on:
  push:
    branches: [main]
    paths:
      - "quotation/**"
      - ".github/workflows/build-quotation-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quotation
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app (unsigned)
        run: |
          xcodebuild -project Quotation.xcodeproj -scheme Quotation -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/Quotation.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry AN-Quotation.ipa Payload
          ls -lh AN-Quotation.ipa
      - name: Publish as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quotation-${{ github.run_number }}
          name: AN Quotation build ${{ github.run_number }}
          files: quotation/AN-Quotation.ipa
          make_latest: false
