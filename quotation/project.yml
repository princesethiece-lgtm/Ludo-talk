name: Quotation
options:
  bundleIdPrefix: com.audionation
  deploymentTarget:
    iOS: "15.0"
targets:
  Quotation:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AN Quotation
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBG
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: "Quotation connects to your Synology NAS on the office Wi-Fi."
        NSPhotoLibraryUsageDescription: "Choose product photos and logos to put in quotations."
        NSCameraUsageDescription: "Take product photos for quotations."
        LSApplicationQueriesSchemes: [tel, whatsapp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audionation.quotation
        PRODUCT_NAME: Quotation
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme: {}
